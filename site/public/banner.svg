<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#0e1322" />
      <stop offset="75%" stop-color="#141c30" />
      <stop offset="100%" stop-color="#0e111a" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fb3" stop-opacity="0.30" />
      <stop offset="35%" stop-color="#ff2d78" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ff2d78" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d78" stop-opacity="0" />
      <stop offset="30%" stop-color="#5dd2e4" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ff2d78" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#5dd2e4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ff2d78" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2439" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212c47" />
      <stop offset="100%" stop-color="#151c2d" />
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121828" />
      <stop offset="100%" stop-color="#0a0e19" />
    </linearGradient>
    <linearGradient id="moonlitEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5dd2e4" stop-opacity="0" />
      <stop offset="55%" stop-color="#5dd2e4" stop-opacity="0.06" />
      <stop offset="75%" stop-color="#f8d6e3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5dd2e4" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="baseFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" stop-opacity="0" />
      <stop offset="100%" stop-color="#0e111a" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="shoot" gradientUnits="userSpaceOnUse" x1="120" y1="118" x2="235" y2="152">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="pixelGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" />
      <circle cx="4" cy="4" r="0.75" fill="#ffffff" fill-opacity="0.03" />
    </pattern>
    <path id="pine" d="M0 0 L5 9 L2.5 9 L7.5 19 L-7.5 19 L-2.5 9 L-5 9 Z" />
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="500" fill="url(#sky)" />
  <rect width="1600" height="500" fill="url(#pixelGrid)" opacity="0.6" />

  <!-- Subtle Aurora Glow -->
  <path d="M0 180 Q 400 120, 800 160 T 1600 130 L 1600 320 L 0 320 Z" fill="url(#aurora)" />

  <!-- Moon Halo -->
  <circle cx="1180" cy="110" r="140" fill="url(#moonGlow)" />

  <!-- Minimalist Moon / Crest -->
  <circle cx="1180" cy="110" r="38" fill="#1b2338" />
  <circle cx="1172" cy="104" r="34" fill="#f8d6e3" opacity="0.9" />
  <circle cx="1186" cy="100" r="30" fill="#0d1220" />

  <!-- Constellations and Pixel Stars -->
  <g fill="#ffffff">
    <!-- Bright stars -->
    <rect x="140" y="70" width="3" height="3" fill="#5dd2e4" opacity="0.8" />
    <rect x="240" y="45" width="2" height="2" opacity="0.6" />
    <rect x="360" y="90" width="3" height="3" fill="#ff2d78" opacity="0.9" />
    <rect x="420" y="60" width="2" height="2" opacity="0.5" />
    <rect x="580" y="35" width="3" height="3" opacity="0.7" />
    <rect x="710" y="85" width="2" height="2" fill="#5dd2e4" opacity="0.8" />
    <rect x="860" y="50" width="3" height="3" opacity="0.6" />
    <rect x="940" y="75" width="2" height="2" fill="#ff5092" opacity="0.8" />
    <rect x="1040" y="40" width="3" height="3" opacity="0.8" />
    <rect x="1320" y="80" width="3" height="3" fill="#5dd2e4" opacity="0.8" />
    <rect x="1440" y="55" width="2" height="2" opacity="0.6" />
    <rect x="1520" y="95" width="3" height="3" fill="#ff2d78" opacity="0.8" />

    <!-- Tiny background dust stars -->
    <rect x="80" y="130" width="1" height="1" opacity="0.4" />
    <rect x="190" y="110" width="1" height="1" opacity="0.4" />
    <rect x="310" y="140" width="1" height="1" opacity="0.3" />
    <rect x="480" y="115" width="1" height="1" opacity="0.5" />
    <rect x="640" y="125" width="1" height="1" opacity="0.4" />
    <rect x="790" y="135" width="1" height="1" opacity="0.3" />
    <rect x="910" y="110" width="1" height="1" opacity="0.5" />
    <rect x="1100" y="150" width="1" height="1" opacity="0.4" />
    <rect x="1260" y="120" width="1" height="1" opacity="0.4" />
    <rect x="1390" y="130" width="1" height="1" opacity="0.3" />
    <rect x="1480" y="145" width="1" height="1" opacity="0.5" />

    <!-- Four-point sparkle stars -->
    <path d="M505 101 l1.3 2.7 l2.7 1.3 l-2.7 1.3 l-1.3 2.7 l-1.3 -2.7 l-2.7 -1.3 l2.7 -1.3 Z" opacity="0.75" />
    <path d="M735 52 l1 2 l2 1 l-2 1 l-1 2 l-1 -2 l-2 -1 l2 -1 Z" fill="#5dd2e4" opacity="0.7" />
    <path d="M1525 137 l1 2 l2 1 l-2 1 l-1 2 l-1 -2 l-2 -1 l2 -1 Z" fill="#ffd7e6" opacity="0.6" />
  </g>

  <!-- Shooting Star -->
  <g opacity="0.8">
    <path d="M120 118 L235 152" stroke="url(#shoot)" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="235" cy="152" r="1.6" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Far Mountain Range (Stepped / Pixelated Ridges) -->
  <path d="M0 320
           L 120 280 L 180 290 L 260 250 L 340 270 L 420 230 L 510 260
           L 620 210 L 730 250 L 840 220 L 960 270 L 1080 200 L 1180 240
           L 1290 190 L 1400 240 L 1520 210 L 1600 250
           L 1600 500 L 0 500 Z"
        fill="url(#ridgeFar)" />
  <!-- Moonlit rim light on the far ridge -->
  <path d="M0 320
           L 120 280 L 180 290 L 260 250 L 340 270 L 420 230 L 510 260
           L 620 210 L 730 250 L 840 220 L 960 270 L 1080 200 L 1180 240
           L 1290 190 L 1400 240 L 1520 210 L 1600 250"
        fill="none" stroke="url(#moonlitEdge)" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Snow caps on the tallest peaks -->
  <g fill="#f8d6e3" opacity="0.16">
    <path d="M404 238 L420 230 L436 235 L431 240 L426 236 L419 241 L412 237 Z" />
    <path d="M606 216 L620 210 L634 215 L629 220 L624 216 L616 221 L610 217 Z" />
    <path d="M1064 209 L1080 200 L1096 206 L1090 211 L1084 207 L1076 212 L1070 208 Z" />
    <path d="M1273 198 L1290 190 L1307 198 L1301 203 L1295 199 L1287 204 L1280 199 Z" />
    <path d="M1507 213 L1520 210 L1533 217 L1528 221 L1523 217 L1515 221 L1510 216 Z" />
  </g>

  <!-- Mid Mountain Range with Subtle Crisp Edge -->
  <path d="M0 370
           L 90 340 L 170 350 L 290 310 L 390 330 L 480 290 L 580 320
           L 700 270 L 810 310 L 920 280 L 1020 320 L 1140 260 L 1260 300
           L 1380 250 L 1490 290 L 1600 270
           L 1600 500 L 0 500 Z"
        fill="url(#ridgeMid)" />

  <!-- Near Ridges and Pine Tree Silhouettes -->
  <path d="M0 430
           L 70 410 L 140 420 L 220 385 L 310 405 L 430 365 L 540 395
           L 660 350 L 770 380 L 890 340 L 990 375 L 1110 330 L 1220 365
           L 1340 325 L 1450 360 L 1540 340 L 1600 370
           L 1600 500 L 0 500 Z"
        fill="url(#ridgeNear)" />
  <g fill="#070b13">
    <use href="#pine" transform="translate(140 405)" />
    <use href="#pine" transform="translate(220 364) scale(1.3)" />
    <use href="#pine" transform="translate(310 392) scale(0.9)" />
    <use href="#pine" transform="translate(430 342) scale(1.4)" />
    <use href="#pine" transform="translate(540 380)" />
    <use href="#pine" transform="translate(660 326) scale(1.5)" />
    <use href="#pine" transform="translate(770 366) scale(0.95)" />
    <use href="#pine" transform="translate(890 317) scale(1.4)" />
    <use href="#pine" transform="translate(990 360)" />
    <use href="#pine" transform="translate(1110 304) scale(1.6)" />
    <use href="#pine" transform="translate(1220 352) scale(0.9)" />
    <use href="#pine" transform="translate(1450 343) scale(1.1)" />
    <use href="#pine" transform="translate(1540 328) scale(0.85)" />
  </g>

  <!-- Stylized Pixel Torii / Shrine Silhouette on Ridge -->
  <g transform="translate(1335, 304)" fill="#232d45">
    <rect x="0" y="2" width="26" height="3" rx="1" />
    <rect x="2" y="7" width="22" height="2" />
    <rect x="5" y="2" width="2.5" height="24" />
    <rect x="18.5" y="2" width="2.5" height="24" />
  </g>

  <!-- Foreground Atmospheric Baseline Fade to Body -->
  <rect x="0" y="430" width="1600" height="70" fill="url(#baseFade)" />
</svg>
